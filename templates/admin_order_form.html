<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Order #{{ order.id }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Edit Order</h1>
        </header>

        <div class="main-content">
            <div class="form-card">
                <h2>Order #{{ order.id }}</h2>
                <form method="POST">
                    <div class="form-group">
                        <label for="customer_name">Customer Name</label>
                        <input type="text" id="customer_name" name="customer_name" value="{{ order.customer_name }}" required>
                    </div>

                    <div class="form-group">
                        <label for="payment_status">Payment Status</label>
                        <select id="payment_status" name="payment_status">
                            <option value="pending" {% if order.payment_status == 'pending' %}selected{% endif %}>Pending</option>
                            <option value="paid" {% if order.payment_status == 'paid' %}selected{% endif %}>Paid</option>
                            <option value="failed" {% if order.payment_status == 'failed' %}selected{% endif %}>Failed</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="transaction_id">UPI Transaction ID</label>
                        <input type="text" id="transaction_id" name="transaction_id" value="{{ order.upi_transaction_id or '' }}">
                    </div>

                    <div class="form-group">
                        <label for="payment_notes">Notes</label>
                        <textarea id="payment_notes" name="payment_notes" rows="3">{{ order.payment_notes or '' }}</textarea>
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <a href="{{ url_for('admin_orders') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
